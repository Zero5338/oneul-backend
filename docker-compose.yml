services:
  mysql:
    image: mysql:8.0
    container_name: oneul-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: oneul
      MYSQL_USER: oneul
      MYSQL_PASSWORD: oneul1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: oneul-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql-data:
